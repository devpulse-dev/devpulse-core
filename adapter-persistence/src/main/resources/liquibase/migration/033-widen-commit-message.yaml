# Расширение commit_details.commit_message: VARCHAR(2000) → VARCHAR(5000).
#
# Сообщение коммита пишется из git как есть — ни GitLogParser, ни CommitRepositoryAdapter его не
# обрезают. Сообщение длиннее лимита колонки не «усекается», а роняет INSERT всего чанка
# («value too long for type character varying(2000)»), то есть один многострочный коммит с
# подробным описанием способен уронить сбор по целому репозиторию. Реальные данные к моменту
# миграции уже содержат сообщение на 2121 символ, так что запас в 2000 исчерпан на практике.
#
# Расширение varchar в PostgreSQL (9.2+) идёт без переписывания таблицы — только правка каталога,
# поэтому операция дешёвая даже на десятках тысяч строк и не держит долгую блокировку.
#
# rollback пуст намеренно: сужение обратно до 2000 обрезало бы (а точнее — уронило бы ALTER на)
# уже сохранённых сообщениях. Откат схемы здесь означал бы потерю данных, а расширенная колонка
# сама по себе безвредна для старого кода.
databaseChangeLog:
  - changeSet:
      id: 033-widen-commit-message
      author: boris.osechinskiy
      changes:
        - modifyDataType:
            tableName: commit_details
            columnName: commit_message
            newDataType: VARCHAR(5000)
      rollback: []
